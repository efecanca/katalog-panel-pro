# AndroidX zorunlu - Material + ConstraintLayout için
android.useAndroidX=true

# Jetifier - eski support library bağımlılıklarını AndroidX'e çevirir
android.enableJetifier=true

# JVM heap - büyük projelerde OOM önler
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Gradle build cache
org.gradle.caching=true

# Paralel build
org.gradle.parallel=true
